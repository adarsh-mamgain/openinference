[project]
name = "inference-server"
version = "0.1.0"
description = "An OpenAI-compatible inference API built with FastAPI"
readme = "README.md"
authors = [
    { name = "Adarsh Mamgain", email = "52105807+adarsh-mamgain@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "llama-cpp-python>=0.3.34",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2",
]

[tool.uv]
# Prebuilt CPU wheels for llama-cpp-python; avoids compiling from source.
# Comment this out if you prefer to build locally.
extra-index-url = ["https://abetlen.github.io/llama-cpp-python/whl/cpu"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
