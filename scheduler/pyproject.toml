[project]
name = "scheduler"
version = "0.1.0"
description = "A priority-queue request scheduler for inference workloads"
readme = "README.md"
authors = [
    { name = "Adarsh Mamgain", email = "52105807+adarsh-mamgain@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
