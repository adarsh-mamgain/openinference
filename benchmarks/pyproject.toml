[project]
name = "benchmarks"
version = "0.1.0"
description = "Concurrency-ramp benchmark harness for the inference-server"
readme = "README.md"
authors = [
    { name = "Adarsh Mamgain", email = "52105807+adarsh-mamgain@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
